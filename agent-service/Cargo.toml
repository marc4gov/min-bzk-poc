[package]
name = "agent-service"
version = "0.1.0"
edition = "2021"

[dependencies]
autoagents = { version = "0.3.7", features = ["ollama"] }
autoagents-derive = "0.3.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
regex = "1.10"
uuid = { version = "1.7", features = ["v4", "serde"] }
ractor = { version = "0.9", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
