<!DOCTYPE html>
<html>
<head>
    <title>Agent Service WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
        #events { max-height: 400px; overflow-y: auto; background: #2a2a2a; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .event { margin: 5px 0; padding: 5px; border-left: 3px solid #444; }
        .event.started { border-color: #4CAF50; }
        .event.complete { border-color: #2196F3; }
        .event.error { border-color: #f44336; }
        .event.orchestration { border-color: #FF9800; }
        input, button { padding: 10px; margin: 5px; font-size: 14px; }
        input { width: 400px; background: #333; color: #eee; border: 1px solid #555; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>Agent Service WebSocket Test</h1>
    <div>
        <input type="text" id="message" placeholder="Enter your message..." value="Welke bestanden staan in de huidige directory?">
        <button onclick="send()">Send</button>
        <button onclick="connect()">Connect</button>
    </div>
    <div id="status">Not connected</div>
    <div id="events"></div>

    <script>
        let ws = null;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.hostname}:8080/ws`;

            document.getElementById('status').textContent = 'Connecting...';
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status').textContent = 'Connected';
                addEvent('system', 'WebSocket connected');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addEvent(data.type || 'unknown', JSON.stringify(data, null, 2));
            };

            ws.onclose = () => {
                document.getElementById('status').textContent = 'Disconnected';
                addEvent('system', 'WebSocket disconnected');
            };

            ws.onerror = (error) => {
                document.getElementById('status').textContent = 'Error';
                addEvent('system', 'WebSocket error');
            };
        }

        function send() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Not connected');
                return;
            }

            const message = document.getElementById('message').value;
            ws.send(JSON.stringify({
                message: message,
                agent_mode: 'auto'
            }));
        }

        function addEvent(type, content) {
            const events = document.getElementById('events');
            const div = document.createElement('div');
            div.className = `event ${type}`;

            let title = type;
            if (type === 'Started') title = '🟢 Agent Started';
            if (type === 'Complete') title = '🔵 Agent Complete';
            if (type === 'Error') title = '🔴 Error';
            if (type === 'OrchestrationComplete') title = '🟠 Orchestration Complete';

            div.innerHTML = `<strong>${title}</strong><pre>${content}</pre>`;
            events.appendChild(div);
            events.scrollTop = events.scrollHeight;
        }

        // Auto-connect on load
        connect();
    </script>
</body>
</html>
